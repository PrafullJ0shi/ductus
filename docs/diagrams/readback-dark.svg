<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readback-dark-title readback-dark-desc">
<title id="readback-dark-title">ductus read-back cascade</title>
<desc id="readback-dark-desc">Each new word is read by trocr-small; words it rejects are re-read by trocr-base; words both reject are written again in a new carrier line, and accepted words go on the page and into the word bank.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A3A7B3"/></marker>
<marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8C9BE0"/></marker>
</defs>
<rect width="960" height="624" fill="#15171C"/>
<path d="M216 320 H246" fill="none" stroke="#A3A7B3" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M424 320 H518" fill="none" stroke="#8C9BE0" stroke-width="1.4" marker-end="url(#aa)"/>
<path d="M336 286 V164 Q336 156 344 156 H742" fill="none" stroke="#A3A7B3" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M216 132 H742" fill="none" stroke="#A3A7B3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a)"/>
<path d="M696 320 H824 Q832 320 832 312 V178" fill="none" stroke="#8C9BE0" stroke-width="1.4" marker-end="url(#aa)"/>
<path d="M608 352 V462" fill="none" stroke="#A3A7B3" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M518 496 H136 Q128 496 128 488 V354" fill="none" stroke="#A3A7B3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a)"/>
<path d="M832 110 V88 Q832 80 824 80 H136 Q128 80 128 88 V110" fill="none" stroke="#A3A7B3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a)"/>
<rect x="447.5" y="74" width="45" height="12" rx="2" fill="#15171C"/><text x="470.0" y="83" fill="#8E93A1" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVED</text>
<rect x="444.0" y="126" width="52" height="12" rx="2" fill="#15171C"/><text x="470.0" y="135" fill="#8E93A1" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BANKED</text>
<rect x="537.5" y="150" width="45" height="12" rx="2" fill="#15171C"/><text x="560.0" y="159" fill="#8E93A1" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
<rect x="439.0" y="296" width="66" height="12" rx="2" fill="#15171C"/><text x="472.0" y="305" fill="#8E93A1" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECTED</text>
<rect x="741.5" y="296" width="45" height="12" rx="2" fill="#15171C"/><text x="764.0" y="305" fill="#8E93A1" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
<rect x="616" y="400" width="66" height="12" rx="2" fill="#15171C"/><text x="649.0" y="409" fill="#8E93A1" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECTED</text>
<rect x="266.5" y="490" width="87" height="12" rx="2" fill="#15171C"/><text x="310.0" y="499" fill="#8E93A1" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW CARRIER</text>
<g id="n-bank">
<rect x="40" y="112" width="176" height="64" rx="6" fill="#15171C"/>
<rect x="40" y="112" width="176" height="64" rx="6" fill="#1C1F26" stroke="#A3A7B3" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="48" y="120" width="20" height="12" rx="2" fill="none" stroke="#A3A7B3" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="58.0" y="129" fill="#A3A7B3" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
<text x="128.0" y="150" fill="#E8E6E1" font-size="15" font-weight="600" font-family="Newsreader, Georgia, serif" text-anchor="middle" style="font-variant-ligatures:none">Word bank</text>
<text x="128.0" y="166" fill="#A3A7B3" font-size="9.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">verified in earlier runs</text>
</g>
<g id="n-ok">
<rect x="744" y="112" width="176" height="64" rx="6" fill="#15171C"/>
<rect x="744" y="112" width="176" height="64" rx="6" fill="#1C1F26" stroke="#A3A7B3" stroke-width="1"/>
<rect x="752" y="120" width="26" height="12" rx="2" fill="none" stroke="#A3A7B3" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="765.0" y="129" fill="#A3A7B3" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
<text x="832.0" y="150" fill="#E8E6E1" font-size="15" font-weight="600" font-family="Newsreader, Georgia, serif" text-anchor="middle" style="font-variant-ligatures:none">Accepted word</text>
<text x="832.0" y="166" fill="#A3A7B3" font-size="9.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">goes on the page</text>
</g>
<g id="n-word">
<rect x="40" y="288" width="176" height="64" rx="6" fill="#15171C"/>
<rect x="40" y="288" width="176" height="64" rx="6" fill="#1C1F26" stroke="#A3A7B3" stroke-width="1"/>
<rect x="48" y="296" width="20" height="12" rx="2" fill="none" stroke="#A3A7B3" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="58.0" y="305" fill="#A3A7B3" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
<text x="128.0" y="326" fill="#E8E6E1" font-size="15" font-weight="600" font-family="Newsreader, Georgia, serif" text-anchor="middle" style="font-variant-ligatures:none">New word</text>
<text x="128.0" y="342" fill="#A3A7B3" font-size="9.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">cut from an RNN line</text>
</g>
<g id="n-small">
<rect x="248" y="288" width="176" height="64" rx="6" fill="#15171C"/>
<rect x="248" y="288" width="176" height="64" rx="6" fill="#1C1F26" stroke="#A3A7B3" stroke-width="1"/>
<rect x="256" y="296" width="38" height="12" rx="2" fill="none" stroke="#A3A7B3" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="275.0" y="305" fill="#A3A7B3" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK</text>
<text x="336.0" y="326" fill="#E8E6E1" font-size="15" font-weight="600" font-family="Newsreader, Georgia, serif" text-anchor="middle" style="font-variant-ligatures:none">trocr-small</text>
<text x="336.0" y="342" fill="#A3A7B3" font-size="9.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">reads every word</text>
</g>
<g id="n-base">
<rect x="520" y="288" width="176" height="64" rx="6" fill="#15171C"/>
<rect x="520" y="288" width="176" height="64" rx="6" fill="rgba(140,155,224,0.10)" stroke="#8C9BE0" stroke-width="1.4"/>
<rect x="528" y="296" width="38" height="12" rx="2" fill="none" stroke="#8C9BE0" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="547.0" y="305" fill="#8C9BE0" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK</text>
<text x="608.0" y="326" fill="#E8E6E1" font-size="15" font-weight="600" font-family="Newsreader, Georgia, serif" text-anchor="middle" style="font-variant-ligatures:none">trocr-base</text>
<text x="608.0" y="342" fill="#A3A7B3" font-size="9.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">re-reads the rejects</text>
</g>
<g id="n-redo">
<rect x="520" y="464" width="176" height="64" rx="6" fill="#15171C"/>
<rect x="520" y="464" width="176" height="64" rx="6" fill="#1C1F26" stroke="#A3A7B3" stroke-width="1"/>
<rect x="528" y="472" width="38" height="12" rx="2" fill="none" stroke="#A3A7B3" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="547.0" y="481" fill="#A3A7B3" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
<text x="608.0" y="502" fill="#E8E6E1" font-size="15" font-weight="600" font-family="Newsreader, Georgia, serif" text-anchor="middle" style="font-variant-ligatures:none">Rewrite round</text>
<text x="608.0" y="518" fill="#A3A7B3" font-size="9.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">new carrier, best of 3</text>
</g>
<line x1="40" y1="584" x2="72" y2="584" stroke="#8C9BE0" stroke-width="1.4"/><text x="80" y="587" fill="#A3A7B3" font-size="10" font-family="'IBM Plex Mono', monospace">accent: the second read, only for rejected words</text><line x1="440" y1="584" x2="472" y2="584" stroke="#A3A7B3" stroke-width="1.2" stroke-dasharray="5,4"/><text x="480" y="587" fill="#A3A7B3" font-size="10" font-family="'IBM Plex Mono', monospace">dashed: word bank or returning</text>
</svg>
